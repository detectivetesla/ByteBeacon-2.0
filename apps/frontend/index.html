<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest-bytebeacon.json" />
    <meta name="description" content="ByteBeacon - Fast, simple and reliable mobile data delivery across MTN, Telecel, and AirtelTigo in Ghana." />
    <title>ByteBeacon — Mobile Data, Simplified</title>

    <!-- Open Graph & Social Card Metadata -->
    <meta property="og:title" content="ByteBeacon — Mobile Data, Simplified" />
    <meta property="og:description" content="Fast, simple and reliable mobile data delivery across MTN, Telecel, and AirtelTigo in Ghana." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ByteBeacon — Mobile Data, Simplified" />
    <meta name="twitter:description" content="Fast, simple and reliable mobile data delivery across MTN, Telecel, and AirtelTigo in Ghana." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Dynamic Synchronous Brand & Domain Shield (Switches to API Solutions on storefront domains) -->
    <script>
      (function() {
        try {
          var host = (window.location && window.location.hostname ? window.location.hostname : '').toLowerCase().trim();
          var isStorefrontDomain = host === 'apisolutions.store' || host.endsWith('.apisolutions.store') || host.includes('apisolutions');

          if (isStorefrontDomain) {
            var path = (window.location && window.location.pathname ? window.location.pathname : '').replace(/^\/+/, '');
            var segments = path.split('/');
            var firstSeg = segments[0] ? segments[0].toLowerCase() : '';
            var storeSlug = '';
            var reserved = ['app','agent','admin','store-console','signin','signup','forgot-password','reset-password','verify-email','mfa','buy','track','info','docs','developer','portal','api','assets','unauthorized','buy-data','bundles'];

            if (firstSeg === 'store' && segments[1]) {
              storeSlug = segments[1];
            } else if (firstSeg && reserved.indexOf(firstSeg) === -1) {
              storeSlug = firstSeg;
            }

            if (!storeSlug && host.indexOf('.') !== -1) {
              var parts = host.split('.');
              if (parts.length > 2 && parts[0] !== 'www' && parts[0] !== 'apisolutions') {
                storeSlug = parts[0];
              }
            }

            var cleanName = storeSlug ? storeSlug.split('-').map(function(w) { return w ? w.charAt(0).toUpperCase() + w.slice(1) : ''; }).join(' ').trim() : '';
            var storeTitle = storeSlug && cleanName
              ? (cleanName + ' · Instant Mobile Data')
              : 'API Solutions — Independent Mobile Telecom Data Storefront Network';
            var ogImgUrl = storeSlug ? ('/api/og?slug=' + encodeURIComponent(storeSlug)) : '/storefront-icon.svg';

            document.title = storeTitle;
            var metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) metaDesc.setAttribute('content', storeSlug ? ('Buy affordable mobile data from ' + cleanName + ' across MTN, Telecel, and AT in Ghana.') : 'API Solutions Network - Instant automated mobile telecom data delivery across Ghana.');
            var iconLink = document.querySelector('link[rel~="icon"]');
            if (iconLink) {
              iconLink.type = 'image/svg+xml';
              iconLink.href = ogImgUrl;
            }
            var manifestLink = document.querySelector('link[rel="manifest"]');
            if (manifestLink) manifestLink.setAttribute('href', '/manifest.json');
            var ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.setAttribute('content', storeTitle);
            var ogDesc = document.querySelector('meta[property="og:description"]');
            if (ogDesc) ogDesc.setAttribute('content', storeSlug ? ('Instant automated mobile data delivery from ' + cleanName + '.') : 'Instant automated mobile telecom data delivery across MTN, Telecel, and AT in Ghana.');
            var ogImg = document.querySelector('meta[property="og:image"]');
            if (ogImg) ogImg.setAttribute('content', ogImgUrl);
            var twTitle = document.querySelector('meta[name="twitter:title"]');
            if (twTitle) twTitle.setAttribute('content', storeTitle);
            var twDesc = document.querySelector('meta[name="twitter:description"]');
            if (twDesc) twDesc.setAttribute('content', storeSlug ? ('Instant automated mobile data delivery from ' + cleanName + '.') : 'Instant automated mobile telecom data delivery across MTN, Telecel, and AT in Ghana.');
            var twImg = document.querySelector('meta[name="twitter:image"]');
            if (twImg) twImg.setAttribute('content', ogImgUrl);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#0A0C10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
