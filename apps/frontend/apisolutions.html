<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/storefront-icon.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="/storefront-icon.png" />
    <link rel="shortcut icon" href="/storefront-icon.png" />
    <link rel="apple-touch-icon" href="/storefront-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://apisolutions.store" />

    <title>API Solutions — Independent Mobile Telecom Data Storefront Network</title>
    <meta name="description" content="API Solutions Network - Instant automated mobile telecom data delivery across MTN, Telecel, and AT in Ghana. Browse partner storefronts and track orders." />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Open Graph & Social Card Metadata -->
    <meta property="og:site_name" content="API Solutions Network" />
    <meta property="og:title" content="API Solutions — Independent Mobile Telecom Data Storefront Network" />
    <meta property="og:description" content="Instant automated mobile telecom data delivery across MTN, Telecel, and AT in Ghana. Browse partner storefronts and track orders." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://apisolutions.store" />
    <meta property="og:image" content="https://apisolutions.store/storefront-icon.png" />
    <meta property="og:image:secure_url" content="https://apisolutions.store/storefront-icon.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="128" />
    <meta property="og:image:height" content="128" />
    <meta property="og:image:alt" content="API Solutions Logo" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="API Solutions — Independent Mobile Telecom Data Storefront Network" />
    <meta name="twitter:description" content="Instant automated mobile telecom data delivery across MTN, Telecel, and AT in Ghana. Browse partner storefronts and track orders." />
    <meta name="twitter:image" content="https://apisolutions.store/storefront-icon.png" />
    <meta name="twitter:image:alt" content="API Solutions Logo" />

    <!-- Dynamic Synchronous Brand & Domain Shield (Switches to specific merchant on store subdomains/slugs) -->
    <script>
      (function() {
        try {
          var host = (window.location && window.location.hostname ? window.location.hostname : '').toLowerCase().trim();
          var path = (window.location && window.location.pathname ? window.location.pathname : '').replace(/^\/+/, '');
          var segments = path.split('/');
          var firstSeg = segments[0] ? segments[0].toLowerCase() : '';
          var storeSlug = '';
          var reserved = ['app','agent','admin','store-console','signin','signup','forgot-password','reset-password','verify-email','mfa','buy','track','info','docs','developer','portal','api','assets','unauthorized','buy-data','bundles'];

          if (firstSeg === 'store' && segments[1]) {
            storeSlug = segments[1];
          } else if (firstSeg && reserved.indexOf(firstSeg) === -1) {
            storeSlug = firstSeg;
          }

          if (!storeSlug && host.indexOf('.') !== -1) {
            var parts = host.split('.');
            if (parts.length > 2 && parts[0] !== 'www' && parts[0] !== 'apisolutions') {
              storeSlug = parts[0];
            }
          }

          if (storeSlug) {
            var cleanName = storeSlug.split('-').map(function(w) { return w ? w.charAt(0).toUpperCase() + w.slice(1) : ''; }).join(' ').trim();
            var storeTitle = cleanName + ' · Instant Mobile Data';
            var ogImgUrl = '/api/og?slug=' + encodeURIComponent(storeSlug);

            document.title = storeTitle;
            var metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) metaDesc.setAttribute('content', 'Buy affordable mobile data from ' + cleanName + ' across MTN, Telecel, and AT in Ghana.');
            var ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.setAttribute('content', storeTitle);
            var ogImg = document.querySelector('meta[property="og:image"]');
            if (ogImg) ogImg.setAttribute('content', ogImgUrl);
            var twTitle = document.querySelector('meta[name="twitter:title"]');
            if (twTitle) twTitle.setAttribute('content', storeTitle);
            var twImg = document.querySelector('meta[name="twitter:image"]');
            if (twImg) twImg.setAttribute('content', ogImgUrl);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#0A0C10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
