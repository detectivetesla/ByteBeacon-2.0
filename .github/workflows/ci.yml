name: ByteBeacon 2.0 CI/CD Production Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # 1. Typecheck & Code Hygiene
  typecheck:
    name: TypeScript Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build -w @bytebeacon/shared
      - name: Typecheck Backend
        run: npm run typecheck -w @bytebeacon/backend
      - name: Typecheck Frontend
        run: npm run typecheck -w @bytebeacon/frontend

  # 2. Automated Backend Test Matrix
  test-backend:
    name: Backend Test Suites (58+ Suites)
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build -w @bytebeacon/shared
      - name: Run Backend Vitest Tests
        run: npm test -w @bytebeacon/backend

  # 3. Automated Frontend Test Matrix
  test-frontend:
    name: Frontend Test Suites
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build shared package
        run: npm run build -w @bytebeacon/shared
      - name: Run Frontend Vitest Tests
        run: npm test -w @bytebeacon/frontend -- --run

  # 4. Production Build Verification
  build:
    name: Production Bundle Compilation
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Shared Package
        run: npm run build -w @bytebeacon/shared
      - name: Build Backend (API & Worker)
        run: npm run build -w @bytebeacon/backend
      - name: Build Frontend (Vercel SPA)
        run: npm run build -w @bytebeacon/frontend

  # 5. Staging Continuous Deployment
  deploy-staging:
    name: Staging Deployment
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging Environment
        run: echo "Successfully deployed ByteBeacon 2.0 to Staging Environment."

  # 6. Production Deployment with Approval Gate
  deploy-production:
    name: Production Deployment Gate
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production Environment
        run: echo "Successfully deployed ByteBeacon 2.0 to Production Environment."
